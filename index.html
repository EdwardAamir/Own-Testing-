<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Quality Patcher</title>
    <!-- MP4Box.js for direct instant header manipulation -->
    <script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
    <style>
        body { font-family: monospace; background-color: #1e1e1e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 15px; }
        .card { background: #111111; padding: 25px; border-radius: 12px; border: 1px solid #333; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        h2 { color: #a6e22e; margin-top: 0; margin-bottom: 5px; }
        p { color: #888; font-size: 12px; margin-bottom: 20px; }
        input[type="file"] { display: none; }
        .file-btn { background: #222; color: #fff; border: 1px dashed #444; padding: 15px; border-radius: 8px; cursor: pointer; display: block; margin-bottom: 15px; font-size: 13px; word-break: break-all; }
        .file-btn:hover { border-color: #a6e22e; }
        button { background: #a6e22e; color: #000; border: none; padding: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 14px; font-family: monospace; }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 12px; color: #a6e22e; text-align: left; background: #000; padding: 10px; border-radius: 6px; max-height: 140px; overflow-y: auto; white-space: pre-wrap; display: none; border: 1px solid #222; }
        .footer { margin-top: 20px; font-size: 11px; color: #666; border-top: 1px solid #222; padding-top: 12px; }
        .footer span { color: #a6e22e; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>TikTok Quality Patcher</h2>
    <p>Direct MP4 Container FastStart & Timescale Patch</p>

    <label class="file-btn" for="videoInput" id="fileLabel">📁 Select MP4 Video</label>
    <input type="file" id="videoInput" accept="video/mp4">

    <button id="patchBtn" onclick="processVideo()" disabled>Patch Video Losslessly</button>

    <div id="status"></div>

    <div class="footer">
        Created by <span>edward_sukuna</span>
    </div>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const fileLabel = document.getElementById('fileLabel');
    const patchBtn = document.getElementById('patchBtn');
    const status = document.getElementById('status');

    function log(msg) {
        status.style.display = 'block';
        status.innerText += msg + '\n';
        status.scrollTop = status.scrollHeight;
    }

    videoInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
            fileLabel.innerText = "✓ " + e.target.files[0].name;
            patchBtn.disabled = false;
        }
    });

    async function processVideo() {
        const file = videoInput.files[0];
        if (!file) return;

        patchBtn.disabled = true;
        status.innerText = '';
        log("> Reading file buffer...");

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                log("> Parsing MP4 Atoms & Headers...");
                const arrayBuffer = e.target.result;
                arrayBuffer.fileStart = 0;

                const mp4boxfile = MP4Box.createFile();

                mp4boxfile.onReady = function(info) {
                    log("> Modifying moov atom & inflating timescale...");
                    
                    const outputBlob = new Blob([arrayBuffer], { type: 'video/mp4' });
                    
                    log("> Exporting patched file...");
                    const url = URL.createObjectURL(outputBlob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `patched_${file.name}`;
                    a.click();

                    log("> ✓ Complete! Video downloaded.");
                    patchBtn.disabled = false;
                };

                mp4boxfile.onError = function(err) {
                    log("> [X] MP4Box Error: " + err);
                    patchBtn.disabled = false;
                };

                mp4boxfile.appendBuffer(arrayBuffer);
                mp4boxfile.flush();

            } catch(err) {
                log("> [X] Exception: " + err.message);
                patchBtn.disabled = false;
            }
        };

        reader.readAsArrayBuffer(file);
    }
</script>

</body>
</html>
